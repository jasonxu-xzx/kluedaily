<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <!-- Edge decoration for the pop look: cobalt polka dots + glossy pink/blue bubbles. Kept outside x 380–1060 so the
       640px game column never sits on a dot at desktop widths; on phones (slice scaling) the edges crop away. -->
  <defs>
    <radialGradient id="gloss" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset=".25" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- left -->
  <circle cx="70" cy="150" r="128" fill="#1F46C8"/>
  <circle cx="255" cy="335" r="48" fill="#FF8AC8"/><circle cx="255" cy="335" r="48" fill="url(#gloss)"/>
  <circle cx="300" cy="120" r="18" fill="#1F46C8"/>
  <circle cx="110" cy="520" r="34" fill="#1F46C8"/>
  <circle cx="40" cy="760" r="96" fill="#8FD3FF"/><circle cx="40" cy="760" r="96" fill="url(#gloss)"/>
  <circle cx="230" cy="640" r="22" fill="#FF8AC8"/>
  <circle cx="300" cy="860" r="40" fill="#1F46C8"/>
  <!-- right -->
  <circle cx="1350" cy="90" r="96" fill="#FF8AC8"/><circle cx="1350" cy="90" r="96" fill="url(#gloss)"/>
  <circle cx="1170" cy="250" r="26" fill="#1F46C8"/>
  <circle cx="1400" cy="430" r="62" fill="#1F46C8"/>
  <circle cx="1210" cy="560" r="44" fill="#8FD3FF"/><circle cx="1210" cy="560" r="44" fill="url(#gloss)"/>
  <circle cx="1380" cy="790" r="150" fill="#1F46C8"/>
  <circle cx="1150" cy="840" r="16" fill="#FF8AC8"/>
</svg>
