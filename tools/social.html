<!doctype html>
<!-- Daily "Today's KueDrop!" social post template. Don't open directly: tools/make-social.mjs passes the day's data
     in ?d=<base64 JSON> and renders it at the right size:
       ?format=portrait   1080x1350  (Instagram feed, Threads)
       ?format=landscape  1600x900   (X)
     Shows the case, date, difficulty and the 4 rotating clue categories (never the answer). -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Righteous&display=swap">
<style>
  :root { --lemon: #FFE14F; --cobalt: #1F46C8; --navy: #10204F; --pink: #FF8AC8; --pale-pink: #FFE6F3; --sky: #8FD3FF; }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow: hidden; background: var(--lemon); font-family: "Righteous", sans-serif; color: var(--navy); }
  .portrait { width: 1080px; height: 1350px; }
  .landscape { width: 1600px; height: 900px; }

  /* background decoration (corners and edges only) */
  .deco > i { position: absolute; display: block; border-radius: 50%; }
  .dot { background: var(--cobalt); }
  .bub { background: radial-gradient(circle at 34% 30%, rgba(255,255,255,.9) 0 10%, rgba(255,255,255,0) 26%), var(--c, var(--pink)); }
  .sky { --c: var(--sky); }
  .tone { border-radius: 0 !important; background-image: radial-gradient(var(--cobalt) 28%, transparent 31%); background-size: 26px 26px; opacity: .2;
    -webkit-mask-image: radial-gradient(closest-side, #000 30%, transparent); mask-image: radial-gradient(closest-side, #000 30%, transparent); }
  .spark { border-radius: 0 !important; }
  .spark svg { display: block; width: 100%; height: 100%; fill: currentColor; }
  .portrait .t1 { width: 560px; height: 560px; right: -160px; top: -170px; }
  .portrait .t2 { width: 520px; height: 520px; left: -170px; bottom: -150px; }
  .portrait .d1 { width: 240px; height: 240px; left: -90px; top: -80px; }
  .portrait .d2 { width: 200px; height: 200px; right: -70px; bottom: -60px; }
  .portrait .b1 { width: 130px; height: 130px; right: 60px; top: 40px; }
  .portrait .b2 { width: 110px; height: 110px; left: 50px; bottom: 60px; }
  .portrait .s1 { width: 64px; height: 64px; left: 170px; top: 60px; color: var(--pink); }
  .portrait .s2 { width: 54px; height: 54px; right: 210px; bottom: 22px; color: #fff; }
  .landscape .t1 { width: 600px; height: 600px; right: -170px; top: -200px; }
  .landscape .t2 { width: 520px; height: 520px; left: -160px; bottom: -170px; }
  .landscape .d1 { width: 230px; height: 230px; left: -80px; top: -80px; }
  .landscape .d2 { width: 200px; height: 200px; right: -60px; bottom: -70px; }
  .landscape .b1 { width: 120px; height: 120px; right: 70px; top: 40px; }
  .landscape .b2 { width: 90px; height: 90px; left: 60px; bottom: 50px; }
  .landscape .s1 { width: 56px; height: 56px; left: 180px; top: 70px; color: var(--pink); }
  .landscape .s2 { width: 48px; height: 48px; right: 230px; bottom: 50px; color: #fff; }

  /* content */
  .page { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; }
  .portrait .page { padding: 64px 70px 56px; gap: 24px; }
  .landscape .page { padding: 60px 90px; gap: 30px; justify-content: center; }
  .chip { font-size: 30px; letter-spacing: .05em; background: var(--pink); color: var(--navy); border: 4px solid var(--cobalt);
    border-radius: 999px; padding: 6px 26px; }
  .title { font-family: "Bagel Fat One", sans-serif; color: var(--cobalt); line-height: .95; text-align: center; letter-spacing: .01em; }
  .portrait .title { font-size: 104px; text-shadow: 7px 7px 0 var(--pink); }
  .landscape .title { font-size: 104px; text-shadow: 6px 6px 0 var(--pink); }
  .meta { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .meta span { background: #fff; border: 4px solid var(--cobalt); border-radius: 999px; padding: 6px 22px; font-size: 30px; box-shadow: 4px 4px 0 var(--cobalt); }
  .meta .diff { background: var(--cobalt); color: #fff; box-shadow: 4px 4px 0 var(--navy); }
  .lead { font-size: 32px; text-align: center; }
  .lead b { font-weight: 400; color: var(--cobalt); }

  .cards { display: grid; gap: 28px; width: 100%; }
  .portrait .cards { grid-template-columns: 1fr 1fr; }
  .landscape .cards { grid-template-columns: repeat(4, 1fr); gap: 26px; }
  .card { background: #fff; border: 5px solid var(--cobalt); border-radius: 30px; box-shadow: 9px 9px 0 var(--cobalt);
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
  .portrait .card { padding: 24px 18px 22px; }
  .landscape .card { padding: 26px 16px 22px; }
  .card:nth-child(even) { box-shadow: 9px 9px 0 var(--pink); }
  .icon { background: var(--pale-pink); border-radius: 50%; display: grid; place-items: center; }
  .portrait .icon { width: 124px; height: 124px; }
  .landscape .icon { width: 130px; height: 130px; }
  .icon svg { width: 62%; height: 62%; overflow: visible; }
  .num { font-size: 26px; color: #fff; background: var(--pink); border: 3px solid var(--cobalt); border-radius: 999px; padding: 0 14px; margin-top: -30px; }
  .name { font-family: "Bagel Fat One", sans-serif; color: var(--cobalt); line-height: 1.02; }
  .portrait .name { font-size: 46px; }
  .landscape .name { font-size: 40px; }
  .rule { color: #4A5680; line-height: 1.25; }
  .portrait .rule { font-size: 24px; }
  .landscape .rule { font-size: 22px; }

  .plus { font-size: 28px; color: var(--navy); background: #fff; border: 3px dashed var(--cobalt); border-radius: 999px; padding: 6px 22px; }
  .cta { display: flex; align-items: center; gap: 18px; }
  .cta .q { font-size: 34px; }
  .cta .url { font-size: 36px; color: #fff; background: var(--cobalt); border-radius: 999px; padding: 8px 32px; box-shadow: 6px 6px 0 var(--navy); }
  .landscape .row { display: flex; align-items: center; gap: 26px; }
</style></head>
<body>
<div class="deco">
  <i class="tone t1"></i><i class="tone t2"></i><i class="dot d1"></i><i class="dot d2"></i><i class="bub b1"></i><i class="bub sky b2"></i>
  <i class="spark s1"><svg viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z"/></svg></i>
  <i class="spark s2"><svg viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z"/></svg></i>
</div>
<div class="page" id="page"></div>
<script>
// One illustration per clue category (64x64 viewBox; cobalt strokes, pink accents).
const C = "#1F46C8", P = "#FF8AC8", S = `fill="none" stroke="${C}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"`;
const T = (x, y, s, txt, fill = C) => `<text x="${x}" y="${y}" font-family="Bagel Fat One" font-size="${s}" fill="${fill}" text-anchor="middle">${txt}</text>`;
const ICONS = {
  artist: `<path d="M24 34 l-10 18" ${S}/><rect x="22" y="8" width="20" height="30" rx="10" fill="${P}" stroke="${C}" stroke-width="5"/><path d="M26 18h12M26 25h12" ${S}/>`,
  year: `<rect x="8" y="12" width="48" height="44" rx="8" ${S}/><path d="M8 24h48M20 6v12M44 6v12" ${S}/>${T(32, 49, 18, "YR", P)}`,
  month: `<rect x="8" y="12" width="48" height="44" rx="8" ${S}/><path d="M8 24h48M20 6v12M44 6v12" ${S}/><circle cx="20" cy="36" r="3.5" fill="${C}"/><circle cx="32" cy="36" r="3.5" fill="${C}"/><circle cx="44" cy="36" r="5" fill="${P}"/><circle cx="20" cy="47" r="3.5" fill="${C}"/><circle cx="32" cy="47" r="3.5" fill="${C}"/>`,
  season: `<path d="M14 50 C14 22 34 10 54 10 C54 34 40 52 14 50Z" fill="${P}" stroke="${C}" stroke-width="5" stroke-linejoin="round"/><path d="M14 50 L40 24" ${S}/>`,
  views: `<rect x="6" y="14" width="52" height="36" rx="10" ${S}/><path d="M27 23 L41 32 L27 41Z" fill="${P}" stroke="${C}" stroke-width="4" stroke-linejoin="round"/>`,
  length: `<circle cx="32" cy="36" r="22" ${S}/><path d="M26 6h12M32 6v8M32 36l9-9" ${S}/><circle cx="32" cy="36" r="4" fill="${P}"/>`,
  genre: `<rect x="8" y="30" width="9" height="22" rx="3" fill="${P}" stroke="${C}" stroke-width="4"/><rect x="21" y="16" width="9" height="36" rx="3" fill="${C}"/><rect x="34" y="24" width="9" height="28" rx="3" fill="${P}" stroke="${C}" stroke-width="4"/><rect x="47" y="10" width="9" height="42" rx="3" fill="${C}"/>`,
  label: `<circle cx="32" cy="32" r="25" fill="${C}"/><circle cx="32" cy="32" r="17" fill="none" stroke="#fff" stroke-width="1.5" opacity=".5"/><circle cx="32" cy="32" r="10" fill="${P}"/><circle cx="32" cy="32" r="3" fill="#fff"/>`,
  letters: `${T(32, 46, 34, "Aa")}<path d="M10 54h44" stroke="${P}" stroke-width="6" stroke-linecap="round"/>`,
  words: `<rect x="4" y="22" width="18" height="20" rx="5" fill="${P}" stroke="${C}" stroke-width="4"/><rect x="25" y="22" width="14" height="20" rx="5" ${S}/><rect x="42" y="22" width="18" height="20" rx="5" fill="${P}" stroke="${C}" stroke-width="4"/>`,
  first: `<rect x="6" y="18" width="16" height="28" rx="5" fill="${P}" stroke="${C}" stroke-width="4"/>${T(14, 37.5, 14, "A", C)}<rect x="25" y="18" width="14" height="28" rx="5" ${S}/><rect x="42" y="18" width="16" height="28" rx="5" ${S}/>`,
  last: `<rect x="6" y="18" width="16" height="28" rx="5" ${S}/><rect x="25" y="18" width="14" height="28" rx="5" ${S}/><rect x="42" y="18" width="16" height="28" rx="5" fill="${P}" stroke="${C}" stroke-width="4"/>${T(50, 37.5, 14, "Z", C)}`,
  lang: `<rect x="4" y="10" width="34" height="30" rx="8" fill="${P}" stroke="${C}" stroke-width="4"/>${T(21, 31.5, 15, "가")}<rect x="26" y="26" width="34" height="30" rx="8" fill="#fff" stroke="${C}" stroke-width="4"/>${T(43, 47.5, 16, "A")}`,
  stage: `<path d="M6 56 H20 V44 H32 V32 H44 V20 H58" ${S}/><path d="M50 4 L52.5 9.5 58 10 54 14 55 20 50 17 45 20 46 14 42 10 47.5 9.5Z" fill="${P}" stroke="${C}" stroke-width="2.5" stroke-linejoin="round"/>`,
};
const icon = id => `<svg viewBox="0 0 64 64">${ICONS[id] || ICONS.genre}</svg>`;
const q = new URLSearchParams(location.search);
const fmt = q.get("format") === "landscape" ? "landscape" : "portrait";
document.body.className = fmt;
const sample = { case: 1, date: "Fri, Nov 20", difficulty: "Tricky", filter: "", clues: [
  { id: "views", name: "MV views", rule: "Tiers · close = next tier" }, { id: "length", name: "Song length", rule: "Close = within 10 seconds" },
  { id: "last", name: "Last letter", rule: "Close = within 2 letters" }, { id: "lang", name: "Title language", rule: "Original title · close = one side mixed" }] };
let d = sample;
try { if (q.get("d")) d = JSON.parse(decodeURIComponent(escape(atob(q.get("d").replace(/-/g, "+").replace(/_/g, "/"))))); } catch (e) { console.error(e); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cards = d.clues.map((c, i) => `<div class="card"><div class="icon">${icon(c.id)}</div><span class="num">${i + 1}</span>
  <div class="name">${esc(c.name)}</div><div class="rule">${esc(c.rule)}</div></div>`).join("");
const meta = `<div class="meta"><span>Case #${d.case}</span><span>${esc(d.date)}</span>${d.filter ? `<span>${esc(d.filter)}</span>` : ""}<span class="diff">${esc(d.difficulty)}</span></div>`;
const plus = `<div class="plus">+ Artist, always on</div>`;
const cta = `<div class="cta"><span class="q">Guess the song in 8 →</span><span class="url">kuedrop.com</span></div>`;
document.getElementById("page").innerHTML = fmt === "portrait"
  ? `<span class="chip">DAILY K-POP SONG GAME</span><div class="title">Today's<br>KueDrop!</div>${meta}<div class="cards">${cards}</div>${plus}${cta}`
  : `<div class="row"><div class="title">Today's KueDrop!</div></div>${meta}<div class="cards">${cards}</div>
     <div class="row">${plus}${cta}</div>`;
</script>
</body></html>
