<!doctype html>
<!-- Daily "Today's KueDrop!" social post template. Don't open directly: tools/make-social.mjs passes the day's data
     in ?d=<base64 JSON> and renders it at the right size:
       ?format=portrait   1080x1350  (Instagram feed, Threads)
       ?format=landscape  1600x900   (X)
     Shows the case, date, difficulty and the 4 rotating clue categories (never the answer). -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Righteous&display=swap">
<style>
  :root { --lemon: #FFE14F; --cobalt: #1F46C8; --navy: #10204F; --pink: #FF8AC8; --pale-pink: #FFE6F3; --sky: #8FD3FF; }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow: hidden; background: var(--lemon); font-family: "Righteous", sans-serif; color: var(--navy); }
  .portrait { width: 1080px; height: 1350px; }
  .landscape { width: 1600px; height: 900px; }

  /* background decoration (corners and edges only) */
  .deco > i { position: absolute; display: block; border-radius: 50%; }
  .dot { background: var(--cobalt); }
  .bub { background: radial-gradient(circle at 34% 30%, rgba(255,255,255,.9) 0 10%, rgba(255,255,255,0) 26%), var(--c, var(--pink)); }
  .sky { --c: var(--sky); }
  .tone { border-radius: 0 !important; background-image: radial-gradient(var(--cobalt) 28%, transparent 31%); background-size: 26px 26px; opacity: .2;
    -webkit-mask-image: radial-gradient(closest-side, #000 30%, transparent); mask-image: radial-gradient(closest-side, #000 30%, transparent); }
  .spark { border-radius: 0 !important; }
  .spark svg { display: block; width: 100%; height: 100%; fill: currentColor; }
  .portrait .t1 { width: 560px; height: 560px; right: -160px; top: -170px; }
  .portrait .t2 { width: 520px; height: 520px; left: -170px; bottom: -150px; }
  .portrait .d1 { width: 240px; height: 240px; left: -90px; top: -80px; }
  .portrait .d2 { width: 200px; height: 200px; right: -70px; bottom: -60px; }
  .portrait .b1 { width: 130px; height: 130px; right: 60px; top: 40px; }
  .portrait .b2 { width: 110px; height: 110px; left: 50px; bottom: 60px; }
  .portrait .s1 { width: 64px; height: 64px; left: 170px; top: 60px; color: var(--pink); }
  .portrait .s2 { width: 54px; height: 54px; right: 210px; bottom: 22px; color: #fff; }
  .landscape .t1 { width: 600px; height: 600px; right: -170px; top: -200px; }
  .landscape .t2 { width: 520px; height: 520px; left: -160px; bottom: -170px; }
  .landscape .d1 { width: 230px; height: 230px; left: -80px; top: -80px; }
  .landscape .d2 { width: 200px; height: 200px; right: -60px; bottom: -70px; }
  .landscape .b1 { width: 120px; height: 120px; right: 70px; top: 40px; }
  .landscape .b2 { width: 90px; height: 90px; left: 60px; bottom: 50px; }
  .landscape .s1 { width: 56px; height: 56px; left: 180px; top: 70px; color: var(--pink); }
  .landscape .s2 { width: 48px; height: 48px; right: 230px; bottom: 50px; color: #fff; }

  /* content */
  .page { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; }
  .portrait .page { padding: 64px 70px 56px; gap: 24px; }
  .landscape .page { padding: 60px 90px; gap: 30px; justify-content: center; }
  .chip { font-size: 30px; letter-spacing: .05em; background: var(--pink); color: var(--navy); border: 4px solid var(--cobalt);
    border-radius: 999px; padding: 6px 26px; }
  .title { font-family: "Bagel Fat One", sans-serif; color: var(--cobalt); line-height: .95; text-align: center; letter-spacing: .01em; }
  .portrait .title { font-size: 104px; text-shadow: 7px 7px 0 var(--pink); }
  .landscape .title { font-size: 104px; text-shadow: 6px 6px 0 var(--pink); }
  .meta { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .meta span { background: #fff; border: 4px solid var(--cobalt); border-radius: 999px; padding: 6px 22px; font-size: 30px; box-shadow: 4px 4px 0 var(--cobalt); }
  .meta .diff { background: var(--cobalt); color: #fff; box-shadow: 4px 4px 0 var(--navy); }
  .lead { font-size: 32px; text-align: center; }
  .lead b { font-weight: 400; color: var(--cobalt); }

  .cards { display: grid; gap: 28px; width: 100%; }
  .portrait .cards { grid-template-columns: 1fr 1fr; }
  .landscape .cards { grid-template-columns: repeat(4, 1fr); gap: 26px; }
  .card { background: #fff; border: 5px solid var(--cobalt); border-radius: 30px; box-shadow: 9px 9px 0 var(--cobalt);
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
  .portrait .card { padding: 24px 18px 22px; }
  .landscape .card { padding: 26px 16px 22px; }
  .card:nth-child(even) { box-shadow: 9px 9px 0 var(--pink); }
  .icon { background: var(--pale-pink); border-radius: 50%; display: grid; place-items: center; }
  .portrait .icon { width: 124px; height: 124px; }
  .landscape .icon { width: 130px; height: 130px; }
  .icon svg { width: 62%; height: 62%; overflow: visible; }
  .num { font-size: 26px; color: #fff; background: var(--pink); border: 3px solid var(--cobalt); border-radius: 999px; padding: 0 14px; margin-top: -30px; }
  .name { font-family: "Bagel Fat One", sans-serif; color: var(--cobalt); line-height: 1.02; }
  .portrait .name { font-size: 46px; }
  .landscape .name { font-size: 40px; }
  .rule { color: #4A5680; line-height: 1.25; }
  .portrait .rule { font-size: 24px; }
  .landscape .rule { font-size: 22px; }

  .plus { font-size: 28px; color: var(--navy); background: #fff; border: 3px dashed var(--cobalt); border-radius: 999px; padding: 6px 22px; }
  .cta { display: flex; align-items: center; gap: 18px; }
  .cta .q { font-size: 34px; }
  .cta .url { font-size: 36px; color: #fff; background: var(--cobalt); border-radius: 999px; padding: 8px 32px; box-shadow: 6px 6px 0 var(--navy); }
  .landscape .row { display: flex; align-items: center; gap: 26px; }

  /* ---------- Recap / debrief: one answer card (song, clue values, solve rate) + a CTA line ---------- */
  .recap .page { justify-content: center; }
  .portrait.recap .page { gap: 34px; padding: 60px 70px; }
  .landscape.recap .page { gap: 34px; padding: 50px 90px; }
  .recap .page > * { flex-shrink: 0; }   /* overflow must show up as page overflow, so the title fit can react */
  .ans { background: #fff; border: 5px solid var(--cobalt); border-radius: 34px; box-shadow: 10px 10px 0 var(--pink);
    position: relative; width: 100%; }
  .portrait .ans { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 54px 44px 40px; gap: 12px; margin-top: 10px; }
  .landscape .ans { display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 50px 50px 40px; gap: 0 50px; margin-top: 8px; }
  .ans .was { font-size: 28px; color: #fff; background: var(--cobalt); border-radius: 999px; padding: 4px 24px; position: absolute; top: -26px; left: 50%; transform: translateX(-50%); white-space: nowrap; }
  .ans .left { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; min-width: 0; }
  /* The title box has a fixed height; the font size changes to fill it (OMG big on one line, long titles on two). */
  .ans .song { font-family: "Bagel Fat One", sans-serif; color: var(--cobalt); line-height: 1; text-shadow: 5px 5px 0 var(--pale-pink); width: 100%;
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .ans .song span { display: block; }
  .portrait .ans .song { height: 230px; }
  .landscape .ans .song { height: 200px; }
  .ans .by { font-size: 40px; color: var(--navy); }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; width: 100%; margin-top: 16px; }
  .fact { display: flex; align-items: center; gap: 14px; background: var(--pale-pink); border-radius: 20px; padding: 10px 16px; text-align: left; }
  .fact .ic { width: 60px; height: 60px; flex: none; background: #fff; border-radius: 50%; display: grid; place-items: center; }
  .fact .ic svg { width: 64%; height: 64%; overflow: visible; }
  .fact .k { font-size: 17px; color: #4A5680; line-height: 1; }
  .fact .v { font-family: "Bagel Fat One", sans-serif; font-size: 34px; color: var(--cobalt); line-height: 1.05; display: flex; align-items: center; gap: 8px; }
  .fact .sw { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--cobalt); }
  .stat { display: flex; align-items: center; gap: 30px; }
  .portrait .stat { width: 100%; justify-content: center; margin-top: 26px; }
  .landscape .stat { flex-direction: column; gap: 16px; text-align: center; padding-left: 10px; align-self: stretch; justify-content: center; }  .ring { position: relative; flex: none; }
  .portrait .ring { width: 200px; height: 200px; }
  .landscape .ring { width: 250px; height: 250px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-family: "Bagel Fat One", sans-serif; color: var(--cobalt); }
  .portrait .ring .pct { font-size: 64px; }
  .landscape .ring .pct { font-size: 76px; }
  .stat .txt { display: flex; flex-direction: column; gap: 10px; text-align: left; }
  .landscape .stat .txt { text-align: center; }
  .stat .big { font-family: "Bagel Fat One", sans-serif; color: var(--cobalt); font-size: 46px; line-height: 1.02; }
  .stat .small { font-size: 28px; color: #4A5680; }
  .recap .cta .q { font-family: "Bagel Fat One", sans-serif; font-size: 44px; color: var(--cobalt); white-space: nowrap; text-shadow: 3px 3px 0 var(--pink); }
  .portrait.recap .cta { flex-direction: column; gap: 18px; }
  .portrait .ans .left { width: 100%; }
</style></head>
<body>
<div class="deco">
  <i class="tone t1"></i><i class="tone t2"></i><i class="dot d1"></i><i class="dot d2"></i><i class="bub b1"></i><i class="bub sky b2"></i>
  <i class="spark s1"><svg viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z"/></svg></i>
  <i class="spark s2"><svg viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z"/></svg></i>
</div>
<div class="page" id="page"></div>
<script src="clue-icons.js"></script>
<script>
const q = new URLSearchParams(location.search);
const fmt = q.get("format") === "landscape" ? "landscape" : "portrait";
document.body.className = fmt;
const sample = { case: 1, date: "Fri, Nov 20", difficulty: "Tricky", filter: "", clues: [
  { id: "wins", name: "Music show wins", rule: "First places · 0 / 1–4 / 5–9 / 10+ · close = next tier" }, { id: "gap", name: "Comeback gap", rule: "Time since the previous release · close = next tier" },
  { id: "first", name: "First letter", rule: "Close = within 2 letters" }, { id: "length", name: "Song length", rule: "Close = within 10 seconds" }] };
let d = sample;
try { if (q.get("d")) d = JSON.parse(decodeURIComponent(escape(atob(q.get("d").replace(/-/g, "+").replace(/_/g, "/"))))); } catch (e) { console.error(e); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const meta = `<div class="meta"><span>Case #${d.case}</span><span>${esc(d.date)}</span>${d.filter ? `<span>${esc(d.filter)}</span>` : ""}<span class="diff">${esc(d.difficulty)}</span></div>`;
const page = document.getElementById("page");
const RECAP_SAMPLE = { kind: "recap", case: 1, date: "Fri, Nov 20", difficulty: "Tricky", filter: "", title: "How Sweet", artist: "NewJeans",
  facts: [{ id: "members", name: "Members", value: "5" }, { id: "comeback", name: "Comeback no.", value: "4th" },
    { id: "year", name: "Release year", value: "2024" }, { id: "first", name: "First letter", value: "H" }], rate: 63, players: 248, avg: "4.6", next: 2 };
if (q.get("kind") === "recap" || d.kind === "recap") renderRecap(d.kind === "recap" ? d : RECAP_SAMPLE);
else {
  const cards = d.clues.map((c, i) => `<div class="card"><div class="icon">${icon(c.id)}</div><span class="num">${i + 1}</span>
    <div class="name">${esc(c.name)}</div><div class="rule">${esc(c.rule)}</div></div>`).join("");
  const plus = `<div class="plus">+ Artist, always on</div>`;
  const cta = `<div class="cta"><span class="q">Guess the song in 8 →</span><span class="url">kuedrop.com</span></div>`;
  page.innerHTML = fmt === "portrait"
    ? `<span class="chip">DAILY K-POP SONG GAME</span><div class="title">Today's<br>KueDrop!</div>${meta}<div class="cards">${cards}</div>${plus}${cta}`
    : `<div class="row"><div class="title">Today's KueDrop!</div></div>${meta}<div class="cards">${cards}</div>
       <div class="row">${plus}${cta}</div>`;
}

// Recap / debrief: yesterday's answer, the share of players who got it, and a nudge to today's case.
// d = { kind: "recap", case, date, difficulty, filter, title, artist, facts: [{id, name, value, swatch?}], rate, players, avg, next }
function renderRecap(r) {
  document.body.classList.add("recap");
  const facts = r.facts.map(f => `<div class="fact"><div class="ic">${icon(f.id)}</div>
    <div><div class="k">${esc(f.name)}</div><div class="v">${f.swatch ? `<i class="sw" style="background:${esc(f.swatch)}"></i>` : ""}${esc(f.value)}</div></div></div>`).join("");
  const R = 54, L = 2 * Math.PI * R, pct = Math.max(0, Math.min(100, Math.round(r.rate)));
  const ring = `<div class="ring"><svg viewBox="-4 -4 136 136"><circle cx="64" cy="64" r="${R}" fill="#fff" stroke="#fff" stroke-width="18"/>
    <circle cx="64" cy="64" r="${R}" fill="none" stroke="var(--pale-pink)" stroke-width="14"/>
    <circle cx="64" cy="64" r="${R}" fill="none" stroke="var(--pink)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${L * pct / 100} ${L}"/>
    <circle cx="64" cy="64" r="${R + 9}" fill="none" stroke="var(--cobalt)" stroke-width="4"/><circle cx="64" cy="64" r="${R - 9}" fill="none" stroke="var(--cobalt)" stroke-width="4"/></svg>
    <div class="pct">${pct}%</div></div>`;
  const stat = `<div class="stat">${ring}<div class="txt"><div class="big">${fmt === "portrait" ? "of players got it right" : "of players<br>got it right"}</div>${r.avg ? `<div class="small">in ${esc(r.avg)} guesses on average</div>` : ""}</div></div>`;
  const ans = `<div class="ans"><span class="was">THE ANSWER WAS</span><div class="left"><div class="song" id="song"><span>${esc(r.title)}</span></div>
    <div class="by">by ${esc(r.artist)}</div><div class="facts">${facts}</div></div>${stat}</div>`;
  const cta = `<div class="cta"><span class="q">Can you guess today's KueDrop?</span><span class="url">kuedrop.com</span></div>`;
  page.innerHTML = fmt === "portrait"
    ? `<span class="chip">YESTERDAY'S KUEDROP</span><div class="title" style="font-size:96px">Did you get it?</div>${ans}${cta}`
    : `<div class="row"><span class="chip">YESTERDAY'S KUEDROP</span><div class="title" style="font-size:84px">Did you get it?</div></div>${ans}${cta}`;
  // Fit the song title into its fixed-height box: the largest font size at which it fits (wrapping as needed).
  const el = document.getElementById("song"), span = el.firstElementChild, max = Math.round(el.clientHeight * 0.92);
  let size = max;
  const fits = () => el.scrollWidth <= el.clientWidth + 1 && span.offsetHeight <= el.clientHeight;
  const fit = () => { size = max; el.style.fontSize = size + "px"; while (!fits() && size > 30) { size -= 3; el.style.fontSize = size + "px"; } };
  fit(); document.fonts.ready.then(fit);   // measure again once Bagel Fat One has loaded
}
</script>
</body></html>
