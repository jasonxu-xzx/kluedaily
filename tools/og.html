<!doctype html>
<!-- Source for site/og.png (1200x630) and site/apple-touch-icon.png. Rebuild with: powershell -File tools/make-images.ps1 -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #f4f5fa; color: #161a33; font-family: "Unbounded", sans-serif; overflow: hidden;
    display: grid; grid-template-columns: 1fr 470px; align-items: center; gap: 40px; padding: 0 80px; box-sizing: border-box; }
  .chip { display: inline-block; font: 600 20px "IBM Plex Mono", monospace; background: #3047d6; color: #fff; border-radius: 6px; padding: 6px 12px; margin-bottom: 26px; letter-spacing: .04em; }
  h1 { font-weight: 800; font-size: 170px; line-height: .9; margin: 0 0 26px; letter-spacing: -.03em; }
  .url { color: #3047d6; margin-top: 18px; }
  p { font: 600 26px "IBM Plex Mono", monospace; color: #5d6280; margin: 0; line-height: 1.4; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .grid i { aspect-ratio: 1; border-radius: 14px; background: #e6e7ef; }
  .h { background: #23a165 !important; } .n { background: #e2ae1c !important; }
</style></head>
<body>
  <div>
    <span class="chip">DAILY K-POP CASE</span>
    <h1>KLUE</h1>
    <p>Guess the song in 8.<br>New clues every midnight KST.</p>
    <p class="url">kluedaily.com</p>
  </div>
  <div class="grid">
    <i></i><i class="n"></i><i></i><i></i><i class="n"></i>
    <i class="h"></i><i class="n"></i><i></i><i class="n"></i><i></i>
    <i class="h"></i><i class="h"></i><i class="n"></i><i class="h"></i><i></i>
    <i class="h"></i><i class="h"></i><i class="h"></i><i class="h"></i><i class="h"></i>
  </div>
</body></html>
