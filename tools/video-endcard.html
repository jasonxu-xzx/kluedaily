<!doctype html>
<!-- End card for the 15-second solve video (1080x1920, 9:16). Rendered to a PNG by tools/make-video.mjs. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Righteous&display=swap">
<style>
  :root { --lemon: #FFE14F; --cobalt: #1F46C8; --navy: #10204F; --pink: #FF8AC8; --pale-pink: #FFE6F3; --sky: #8FD3FF; }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow: hidden; background: var(--lemon); font-family: "Righteous", sans-serif; color: var(--navy); }
  body { width: 1080px; height: 1920px; position: relative; }
  .deco > i { position: absolute; display: block; border-radius: 50%; }
  .dot { background: var(--cobalt); }
  .bub { background: radial-gradient(circle at 34% 30%, rgba(255,255,255,.9) 0 10%, rgba(255,255,255,0) 26%), var(--c, var(--pink)); }
  .sky { --c: var(--sky); }
  .tone { border-radius: 0 !important; background-image: radial-gradient(var(--cobalt) 28%, transparent 31%); background-size: 26px 26px; opacity: .2;
    -webkit-mask-image: radial-gradient(closest-side, #000 30%, transparent); mask-image: radial-gradient(closest-side, #000 30%, transparent); }
  .t1 { width: 640px; height: 640px; right: -180px; top: -180px; } .t2 { width: 620px; height: 620px; left: -200px; bottom: -160px; }
  .d1 { width: 280px; height: 280px; left: -100px; top: -90px; } .d2 { width: 260px; height: 260px; right: -90px; bottom: -80px; }
  .b1 { width: 150px; height: 150px; right: 70px; top: 90px; } .b2 { width: 130px; height: 130px; left: 60px; bottom: 110px; }
  .page { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 56px; padding: 120px 80px; text-align: center; }
  .brand { font-family: "Bagel Fat One", sans-serif; font-size: 64px; color: var(--cobalt); }
  .title { font-family: "Bagel Fat One", sans-serif; color: var(--cobalt); font-size: 132px; line-height: .98; text-shadow: 8px 8px 0 var(--pink); }
  .when { background: #fff; border: 5px solid var(--cobalt); border-radius: 40px; box-shadow: 10px 10px 0 var(--pink); padding: 34px 50px; }
  .when .k { font-size: 36px; color: #4A5680; }
  .when .v { font-family: "Bagel Fat One", sans-serif; font-size: 84px; color: var(--cobalt); line-height: 1.05; }
  .when .s { font-family: "Bagel Fat One", sans-serif; font-size: 48px; color: var(--pink); -webkit-text-stroke: 2px var(--cobalt); }
  .link { font-family: "Bagel Fat One", sans-serif; font-size: 96px; color: #fff; background: var(--cobalt); border-radius: 999px; padding: 18px 70px 26px; box-shadow: 10px 10px 0 var(--navy); }
  .bio { font-size: 40px; margin-top: -24px; }
</style></head>
<body>
<div class="deco"><i class="tone t1"></i><i class="tone t2"></i><i class="dot d1"></i><i class="dot d2"></i><i class="bub b1"></i><i class="bub sky b2"></i></div>
<div class="page">
  <div class="brand">KueDrop</div>
  <div class="title">Can you guess<br>today's<br>KueDrop?</div>
  <div class="when"><div class="k">A new K-pop song every day at</div><div class="v">7 AM PT</div><div class="s">midnight KST</div></div>
  <div class="link">kuedrop.com</div>
  <div class="bio">Free · link in bio</div>
</div>
</body></html>
